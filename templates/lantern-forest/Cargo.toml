[package]
name = "lantern-forest"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "lantern_forest_web"
crate-type = ["cdylib"]

[features]
editor = ["quaso/editor"]

[dependencies.quaso]
version = "0.59"
path = "../../crates/quaso"
default-features = false

[build-dependencies.quaso]
version = "0.59"
path = "../../crates/quaso"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

[profile.dev.package."*"]
opt-level = 3
